name: Build Khadas Device Tree (DTB/DTBO)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-dtbs:
    # 使用 GitHub 官方提供的免费执行机
    runs-on: ubuntu-latest

    env:
      # 基准 Linux 内核大本营（提供完整的核心编译系统、Kbuild、Makefile 以及基本依赖关系）
      BASE_KERNEL_REPO: "https://github.com"
      BASE_KERNEL_BRANCH: "odroidg12-5.15.y"
      
      # 目标指向您指定的 Khadas 官方外置驱动与设备树仓库及分支
      KERNEL_REPO: "https://github.com/khadas/common_drivers"
      KERNEL_BRANCH: "khadas-vim4-android14"
      
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: 1. 安装交叉编译器与编译依赖工具
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gcc-aarch64-linux-gnu \
            bison flex libssl-dev libncurses-dev device-tree-compiler bc lzop rsync

      - name: 2. 浅克隆主内核编译系统 (提供基础Makefile架构)
        run: |
          # 规范化引用，直接采用原生 $ 变量引用，避免 GitHub 变量解析引发语法中断
          git clone --depth 1 -b "$BASE_KERNEL_BRANCH" "$BASE_KERNEL_REPO" linux-kernel

      - name: 3. 自动化克隆 Khadas 指定分支并执行代码融合
        run: |
          # 1. 精准抓取 Khadas 的 khadas-vim4-android14 分支
          git clone --depth 1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" khadas-drivers
          
          # 2. 将 Khadas 的外置设备树代码合并到内核的 Amlogic 平台目录下
          rsync -av khadas-drivers/arch/arm64/boot/dts/amlogic/ linux-kernel/arch/arm64/boot/dts/amlogic/
          
          # 3. 额外同步可能会被设备树引用的外置驱动头文件
          if [ -d "khadas-drivers/include" ]; then
            rsync -av khadas-drivers/include/ linux-kernel/include/
          fi

      - name: 4. 配置内核并选择最优 Defconfig
        run: |
          cd linux-kernel
          # 自动扫描并匹配可用配置文件，生成编译上下文 .config
          if [ -f "arch/arm64/configs/amlogic_g12_defconfig" ]; then
            CONF="amlogic_g12_defconfig"
          elif [ -f "arch/arm64/configs/meson64_defconfig" ]; then
            CONF="meson64_defconfig"
          else
            CONF="defconfig"
          fi
          
          echo "Selected Config: $CONF"
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE $CONF

      - name: 5. 编译 Khadas 专属设备树 (DTB & DTBO)
        run: |
          cd linux-kernel
          # 调动 Kbuild 进行全量编译生成特定芯片架构的设备树二进制文件
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE dtbs

      - name: 6. 收集并上传生成的 DTB/DTBO 文件
        uses: actions/upload-artifact@v4
        with:
          name: khadas-vim4-device-tree-blobs
          path: |
            linux-kernel/arch/arm64/boot/dts/amlogic/*.dtb
            linux-kernel/arch/arm64/boot/dts/amlogic/*.dtbo
          retention-days: 7
